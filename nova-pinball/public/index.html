<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Play Nova Pinball in your browser.">
  <meta name="application-name" content="Nova Pinball">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090b18'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23ffffff'/%3E%3Cpath d='M32 5l5.5 18.5L56 29l-18.5 5.5L32 59l-5.5-24.5L8 29l18.5-5.5z' fill='%237f8cff' fill-opacity='.75'/%3E%3C/svg%3E">
  <title>Nova Pinball</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar accessibility-hud">
      <div class="title-block">
        <h1>Nova Pinball</h1>
        <p id="status">Premi SPAZIO per iniziare</p>
        <p id="mission" class="mission">Gigante Rossa · Obiettivo: completa NOVA</p>
      </div>
      <div class="stats" aria-label="Punteggio e palline">
        <span><small>Punti</small><strong id="score">0</strong></span>
        <span><small>Palline</small><strong id="balls">6</strong></span>
      </div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="800" height="600" aria-label="Nova Pinball"></canvas>
      <div id="gameBadges" class="game-badges" aria-live="polite">
        <span id="safeBadge" class="badge safe" hidden>SAFE MODE</span>
        <span id="tiltBadge" class="badge tilt" hidden>TILT</span>
      </div>
      <div id="overlay" class="overlay" aria-live="polite"></div>
      <div class="touch-controls" aria-label="Controlli touch">
        <button id="leftBtn" type="button">◀ FLIP</button>
        <button id="nudgeBtn" type="button">LANCIA</button>
        <button id="rightBtn" type="button">FLIP ▶</button>
      </div>
    </section>

    <footer>
      <div class="footer-controls" aria-label="Controlli rapidi">
        <button id="cameraBtn" type="button">Vista: Pallina</button>
        <button id="soundBtn" type="button">Suoni: Sì</button>
        <button id="musicBtn" type="button" title="Cambia musica">♫ Nessuna</button>
        <button id="fullscreenBtn" type="button">Schermo intero</button>
        <button id="langBtn" type="button" aria-label="Language">EN</button>
        <button id="menuBtn" type="button">Menu</button>
      </div>
      <div class="footer-help" aria-label="Istruzioni tastiera">
        <span>Z / M (o frecce): flipper</span>
        <span>Spazio: avvio / colpo al tavolo · Esc: pausa</span>
      </div>
    </footer>
  </main>
  <script type="module" src="src/app.js"></script>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
