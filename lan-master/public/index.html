<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05111a"><meta name="description" content="Lan Master — faithful HTML5 restoration of Shiru's Public Domain NES puzzle game."><title>Lan Master — Libre Arcade restoration</title><link rel="icon" href="data:,"><link rel="stylesheet" href="src/style.css"></head><body><div id="app">
<section id="menuScreen" class="screen nes-page"><div class="nes-frame"><canvas id="titleCanvas" width="256" height="240" tabindex="0" data-aria-i18n="titleScreen" aria-label="Lan Master title screen"></canvas></div><div id="codeControls" class="subcontrols hidden"><input id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" spellcheck="false" data-aria-i18n="codeLabel" aria-label="4 digit code"><button id="codeOk">OK</button><button id="codeBack" data-i18n="back">Back</button></div><div id="menuStatus" class="status" role="status" aria-live="polite"></div><div class="subcontrols"><button id="helpButton" data-i18n="howTo">How to Play</button><button id="creditsButton" data-i18n="credits">Credits</button><button id="langButton">IT</button></div></section>
<section id="helpScreen" class="screen page hidden"><h2 id="helpTitle" tabindex="-1" data-i18n="howTo">How to Play</h2><div id="helpText"></div><button class="back" data-i18n="back">Back</button></section>
<section id="creditsScreen" class="screen page hidden"><h2 id="creditsTitle" tabindex="-1" data-i18n="credits">Credits</h2><div id="creditsText"></div><div class="subcontrols"><button id="resetDataButton" data-i18n="reset">Reset settings</button><button class="back" data-i18n="back">Back</button></div><div id="creditsStatus" class="status" role="status" aria-live="polite"></div></section>
<section id="endingScreen" class="screen nes-page hidden"><div class="nes-frame"><canvas id="endingCanvas" width="256" height="240" data-aria-i18n="endingScreenLabel" aria-label="Lan Master ending screen"></canvas></div><div class="subcontrols"><button id="endingMenu" data-i18n="menu">Main Menu</button></div></section>
<section id="gameScreen" class="screen nes-page hidden"><div class="nes-frame"><canvas id="game" width="256" height="240" data-aria-i18n="gameScreenLabel" aria-label="Lan Master game board"></canvas></div><div class="controls"><div class="dpad"><button class="up" data-act="up" data-aria-i18n="up" aria-label="Up">▲</button><button class="left" data-act="left" data-aria-i18n="left" aria-label="Left">◀</button><button class="down" data-act="down" data-aria-i18n="down" aria-label="Down">▼</button><button class="right" data-act="right" data-aria-i18n="right" aria-label="Right">▶</button></div><button data-act="a" data-aria-i18n="buttonA" aria-label="A: rotate 90 degrees">A</button><button data-act="b" data-aria-i18n="buttonB" aria-label="B: rotate 270 degrees">B</button><button data-act="select" data-aria-i18n="select" aria-label="Select: rotate 180 degrees">SEL</button><button data-act="start" data-aria-i18n="startPause" aria-label="Start: pause">START</button></div></section>
</div><script src="src/levels.js"></script><script src="src/core.js"></script><script src="src/nes-assets.js"></script><script src="src/nes-gfx.js"></script><script src="src/transitions.js"></script><script src="src/audio-data.js"></script><script src="src/famitone.js"></script><script src="src/nes-audio.js"></script><script src="src/app.js"></script>
<script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
