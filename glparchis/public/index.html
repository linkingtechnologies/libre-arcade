<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4">
  <title>glParchis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>glParchis</h1>
      <p id="subtitle">Il classico Parchís</p>
    </div>
    <div class="top-actions">
      <label class="compact"><span id="languageLabel">Lingua</span>
        <select id="language"><option value="it">Italiano</option><option value="en">English</option></select>
      </label>
      <button id="newGame" class="secondary" type="button">Nuova partita</button>
    </div>
  </header>

  <main>
    <section id="setup" class="panel setup-panel">
      <div class="section-title">
        <div>
          <h2 id="setupTitle">Configura la partita</h2>
          <p id="setupIntro">Scegli tabellone, giocatori e computer.</p>
        </div>
      </div>

      <div class="setup-grid">
        <label><span id="boardLabel">Tabellone</span>
          <select id="maxPlayers"><option value="3">3 giocatori</option><option value="4" selected>4 giocatori</option><option value="6">6 giocatori</option><option value="8">8 giocatori</option></select>
        </label>
        <label><span id="difficultyLabel">Difficoltà computer</span>
          <select id="difficulty">
            <option value="40">Molto facile</option><option value="55">Facile</option><option value="70" selected>Normale</option><option value="85">Difficile</option><option value="100">Molto difficile</option>
          </select>
        </label>
      </div>

      <div id="playersSetup" class="players-setup"></div>
      <p id="setupError" class="error" role="alert"></p>
      <div class="setup-actions">
        <button id="startGame" class="primary" type="button">Inizia partita</button>
        <button id="resumeGame" class="secondary" type="button">Continua partita</button>
      </div>
    </section>

    <section id="game" class="game-layout hidden">
      <section class="board-panel panel">
        <div class="board-head">
          <div>
            <h2 id="turnTitle">Turno</h2>
            <p id="turnDetail"></p>
          </div>
          <div class="game-actions">
            <button id="saveGame" class="secondary" type="button">Salva</button>
          </div>
        </div>
        <div id="canvasWrap" class="canvas-wrap">
          <canvas id="board" aria-label="Tabellone glParchis"></canvas>
        </div>
      </section>

      <aside class="side-column">
        <section class="panel control-panel">
          <div id="activeColor" class="active-color"></div>
          <div id="die" class="die" aria-live="polite">–</div>
          <button id="roll" class="primary big" type="button">Tira il dado</button>
          <div id="moveChoices" class="move-choices"></div>
          <label class="check-row"><input id="autoUnique" type="checkbox" checked><span id="autoUniqueLabel">Muovi automaticamente se c’è una sola scelta</span></label>
          <label class="check-row"><input id="sound" type="checkbox" checked><span id="soundLabel">Suoni</span></label>
        </section>

        <section class="panel">
          <h3 id="playersTitle">Giocatori</h3>
          <div id="playersStatus" class="players-status"></div>
        </section>

        <section class="panel log-panel">
          <h3 id="logTitle">Cronologia</h3>
          <ol id="log"></ol>
        </section>
      </aside>
    </section>
  </main>


  <script type="module" src="src/ui/app.js"></script>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
