<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪿%3C/text%3E%3C/svg%3E" />

        <link rel="stylesheet" href="./css/style.css" />
        <link rel="stylesheet" href="./css/create.css" />

        <title>Game of the Goose</title>
    </head>

    <body>
        <div id="ruleset-modal" class="modal">
            <div class="modal-content">
                <button type="button" class="close modal-close-button" data-i18n-aria-label="common.close" aria-label="Close">&times;</button>
                <h3 class="modal-title"></h3>
                <p class="modal-text"></p>
            </div>
        </div>

        <div class="container">
            <h2 data-i18n="create.title">New game</h2>

            <div class="input-section">
                <div>
                    <label for="ruleset-selector" data-i18n="create.gameRules">Game rules:</label>
                    <div id="ruleset-container">
                        <select id="ruleset-selector" name="rulesets" aria-describedby="ruleset-hint">
                            <option value="modern">Modern — simpler</option>
                            <option value="classic">Classic — traditional</option>
                        </select>
                        <button type="button" class="info-icon info-icon-button" data-i18n-aria-label="create.showRules" aria-label="Show rules">i</button>
                    </div>
                    <p id="ruleset-hint" class="ruleset-hint" data-i18n="create.rulesHint">Modern uses one die; Classic uses two dice and the traditional special spaces.</p>
                </div>

                <div>
                    <label for="num-players" data-i18n="create.numPlayers">Number of players (1-6):</label>
                    <input type="number" id="num-players" name="num-players" value="4" min="1" max="6" />
                </div>

                <div>
                    <label data-i18n="create.playerNames">Player names:</label>
                    <div id="player-names" class="player-name-inputs"></div>
                </div>
            </div>

            <button id="start-game-button" class="button" data-i18n="create.startGame">Start game</button>
            <p id="create-status" class="form-status" role="status" aria-live="polite"></p>
        </div>

        <script type="module" src="./src/create-game.js"></script>
        <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </body>
</html>
