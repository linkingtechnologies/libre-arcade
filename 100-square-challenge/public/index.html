<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101419">
  <meta name="description" content="100-Square Challenge — a faithful browser adaptation of the historical TAJJAVA puzzle.">
  <title>100-Square Challenge — Libre Arcade</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="https://linkingtechnologies.github.io/libre-arcade/" target="_blank" rel="noopener noreferrer" data-i18n="archive">Libre Arcade</a>
      <div class="top-actions">
        <button type="button" class="text-button" id="help-button" aria-label="How to play"><span class="compact-icon" aria-hidden="true">?</span><span data-i18n="help">How to play</span></button>
        <button type="button" class="text-button" id="credits-button" aria-label="Credits"><span class="compact-icon" aria-hidden="true">ⓘ</span><span data-i18n="credits">Credits</span></button>
        <button type="button" class="sound-button" id="sound-button" aria-label="Turn sound on" aria-pressed="false" title="Turn sound on">🔇</button>
        <button type="button" class="lang-button" id="lang-button" aria-label="Language">IT</button>
      </div>
    </header>
    <main class="main">
      <section id="menu" class="menu-screen" aria-labelledby="menu-title">
        <div class="menu-icon" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span></div>
        <h1 id="menu-title">100-Square<br>Challenge</h1>
        <p class="menu-caption" data-i18n="tagline">How far can you get?</p>
        <button class="primary menu-play" type="button" id="play-button" data-i18n="play">Play</button>
      </section>
      <section id="game" class="game-screen" hidden aria-label="100-Square Challenge">
        <div class="game-heading">
          <h1>100-Square Challenge</h1>
          <div class="counter" aria-label="Squares filled"><strong id="score">0</strong><span>/ 100</span></div>
        </div>
        <div class="board-area"><div id="board" class="board" role="group" aria-label="Game board"></div></div>
        <div id="status" role="status" aria-live="polite" class="status"></div>
        <nav class="game-actions" aria-label="Game menu">
          <button type="button" id="new-button" data-i18n="newGame">Start new game</button>
          <button type="button" id="undo-button" data-i18n="undo">Undo last move</button>
          <button type="button" id="back-button" data-i18n="home">Main menu</button>
        </nav>
      </section>
    </main>
    <div id="dialog-backdrop" class="dialog-backdrop" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" aria-label="Close" class="close-button">×</button></header>
        <p id="dialog-body"></p><p id="dialog-extra"></p>
        <div id="dialog-links" class="dialog-links" hidden>
          <a href="https://linkingtechnologies.github.io/libre-arcade/" target="_blank" rel="noopener noreferrer">Libre Arcade ↗</a>
          <a href="./licenses/AGPL-3.0.txt" target="_blank" rel="noopener noreferrer">GNU AGPLv3 ↗</a>
          <a href="./SOURCE.md" target="_blank" rel="noopener noreferrer" data-i18n="sourceLink">Source code & notices ↗</a>
        </div>
        <button type="button" id="dialog-done" class="primary">Close</button>
      </section>
    </div>
  </div>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
