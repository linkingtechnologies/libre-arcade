<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20242a">
  <title>Sliding Tile Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar" aria-label="Game controls" data-i18n-aria="gameControls">
    <div class="brand">Sliding Tile Puzzle</div>
    <details class="toolbarMenu">
      <summary data-i18n="gameMenu">Game</summary>
      <div class="menuPanel" role="group" aria-label="Game" data-i18n-aria="gameMenu">
        <button id="newBtn" type="button" data-i18n="newGame">New puzzle</button>
      </div>
    </details>
    <details class="toolbarMenu puzzleMenu">
      <summary data-i18n="puzzleMenu">Puzzle</summary>
      <div class="menuPanel settingsPanel" role="group" aria-label="Puzzle" data-i18n-aria="puzzleMenu">
        <button id="galleryBtn" type="button" data-i18n="gallery">Gallery</button>
        <label class="fileBtn"><span data-i18n="myImage">My image</span><input id="imageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
        <button id="previewBtn" type="button" data-i18n="preview">Preview</button>
        <label class="compactControl"><span data-i18n="size">Size</span>
          <select id="sizeSelect"><option value="3">3×3</option><option value="4" selected>4×4</option><option value="5">5×5</option></select>
        </label>
        <label class="compactControl colorControl"><span data-i18n="backgroundColor">Background</span><input id="backgroundInput" type="color" value="#37404a" aria-label="Background" data-i18n-aria="backgroundColor"></label>
      </div>
    </details>
    <details class="toolbarMenu infoMenu">
      <summary data-i18n="helpMenu">Help</summary>
      <div class="menuPanel" role="group" aria-label="Help" data-i18n-aria="helpMenu">
        <button id="helpBtn" type="button" data-i18n="help">Instructions</button>
        <button id="creditsBtn" type="button" data-i18n="credits">Credits</button>
      </div>
    </details>
    <span id="loadStatus" class="loadStatus hidden" role="status" aria-live="polite"></span>
    <span class="spacer"></span><button id="langBtn" type="button" aria-label="Change language" data-i18n-aria="changeLanguage">IT</button>
  </header>
  <main>
    <canvas id="game" tabindex="0" aria-label="Sliding tile puzzle board" data-i18n-aria="boardLabel" aria-describedby="boardHint" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Enter Space"></canvas>
    <p id="boardHint" class="srOnly" data-i18n="boardHint"></p>
    <div id="complete" class="complete hidden" role="status" aria-live="polite"><span data-i18n="complete">Puzzle complete!</span></div>
  </main>
  <dialog id="galleryDialog" class="galleryDialog"><button class="close" type="button" aria-label="Close" data-i18n-aria="closeLabel">×</button><h2 data-i18n="choosePicture">Choose a picture</h2><p class="dialogIntro" data-i18n="galleryIntro"></p><div id="galleryGrid" class="galleryGrid"></div></dialog>
  <dialog id="previewDialog" class="previewDialog"><button class="close" type="button" aria-label="Close" data-i18n-aria="closeLabel">×</button><h2 data-i18n="previewTitle">Picture preview</h2><img id="previewImage" alt="Puzzle image preview" data-i18n-alt="previewAlt"></dialog>
  <dialog id="helpDialog"><button class="close" type="button" aria-label="Close" data-i18n-aria="closeLabel">×</button><h2 data-i18n="helpTitle">How to play</h2><p data-i18n="help1"></p><p data-i18n="help2"></p><p data-i18n="help3"></p><p data-i18n="help4"></p><p data-i18n="help5"></p><p data-i18n="help6"></p></dialog>
  <dialog id="creditsDialog"><button class="close" type="button" aria-label="Close" data-i18n-aria="closeLabel">×</button><h2 data-i18n="credits">Credits</h2><p data-i18n="originalCredit"></p><p><span data-i18n="photosCredit">Photographs ©</span> <a href="http://photos.jstechs.com/" target="_blank" rel="noopener">JS Nature Photos</a>, <span data-i18n="licensedUnder">licensed under</span> <a href="https://creativecommons.org/licenses/by-sa/3.0/us/" target="_blank" rel="noopener">CC BY-SA 3.0 US</a>.</p><p><span data-i18n="restorationCredit">HTML5 restoration and preservation by</span> <a href="https://linkingtechnologies.github.io/libre-arcade/" target="_blank" rel="noopener">Libre Arcade</a>.</p></dialog>
  <script src="app.bundle.js"></script>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
