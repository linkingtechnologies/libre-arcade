<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libre Arcade</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1613;
    --bg-glow: #17251f;
    --panel: #16201c;
    --panel-hover: #1b2621;
    --panel-border: #26362f;
    --text: #eef3ef;
    --muted: #9db3a8;
    --accent: #d8ff80;
    --accent-ink: #12190f;
    --cat-cards: #ffd166;
    --cat-puzzle: #7dd3fc;
    --cat-arcade: #fca5a5;
    --cat-platform: #c4b5fd;
    --cat-strategy: #f472b6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(60rem 30rem at 50% -10%, var(--bg-glow), transparent 65%),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 3rem 1.5rem 1rem;
    text-align: center;
    position: relative;
  }
  .lang-toggle {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    display: inline-flex;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    overflow: hidden;
    background: var(--panel);
  }
  .lang-toggle button {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
  }
  .lang-toggle button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: clamp(2rem, 5vw, 2.7rem);
    letter-spacing: -0.02em;
  }
  header p.tagline {
    margin: 0 auto;
    max-width: 34rem;
    color: var(--muted);
  }
  main {
    max-width: 72rem;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0;
    margin-bottom: 0.5rem;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  .search-input {
    font: inherit;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 0.45rem 1rem;
    flex: 1 1 11rem;
    max-width: 16rem;
    min-width: 0;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus, .search-input:focus-visible {
    outline: none;
    border-color: var(--accent);
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    flex: 2 1 auto;
  }
  .filter-pill {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--text); }
  .filter-pill[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .count {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  section.category {
    margin-top: 2rem;
  }
  section.category h2 {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 1.05rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 0.6rem;
    margin: 0 0 1rem;
  }
  section.category h2 .dot {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: var(--dot);
    flex: none;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 1rem;
  }
  a.card {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 1.25rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--dot);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover, a.card:focus-visible {
    border-color: var(--accent);
    border-left-color: var(--dot);
    background: var(--panel-hover);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.6);
  }
  a.card .top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
  }
  a.card .year {
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
  }
  a.card h3 {
    margin: 0;
    font-size: 1.1rem;
  }
  a.card p {
    margin: 0.2rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  [hidden] { display: none !important; }
  .no-results {
    color: var(--muted);
    text-align: center;
    padding: 3rem 0;
  }
  footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang-btn="it">IT</button>
      <button type="button" data-lang-btn="en">EN</button>
    </div>
    <h1>Libre Arcade</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </header>
  <main>
    <div class="toolbar">
      <input type="search" id="searchInput" class="search-input" autocomplete="off">
      <div class="filters" id="filters"></div>
      <span class="count" id="count"></span>
    </div>
    <div id="categories"></div>
    <p class="no-results" id="noResults" hidden data-i18n="noResults"></p>
  </main>
  <footer>
    <span data-i18n="footer"></span>
    <a href="README.md">README.md</a>
    · <a href="https://github.com/linkingtechnologies/libre-arcade/issues" data-i18n="feedback"></a>
  </footer>
  <script>
    const TEXT = {
      it: {
        tagline: 'Archeologia videoludica, giocabile.',
        all: 'Tutti',
        footer: 'Ogni gioco qui è libero e open-source — vedi',
        searchPlaceholder: 'Cerca un gioco…',
        searchAria: 'Cerca un gioco',
        noResults: 'Nessun gioco trovato.',
        feedback: 'Segnala un problema o un\'idea',
      },
      en: {
        tagline: 'Video game archaeology, playable.',
        all: 'All',
        footer: 'Every game here is free and open-source — see',
        searchPlaceholder: 'Search for a game…',
        searchAria: 'Search for a game',
        noResults: 'No games found.',
        feedback: 'Report a bug or an idea',
      },
    };

    const CATEGORIES = [
      { id: 'cards', label: { it: 'Carte e Tavolo', en: 'Card & Board Games' } },
      { id: 'puzzle', label: { it: 'Puzzle', en: 'Puzzle' } },
      { id: 'arcade', label: { it: 'Classici Arcade', en: 'Arcade Classics' } },
      { id: 'platform', label: { it: 'Platform', en: 'Platformers' } },
      { id: 'strategy', label: { it: 'Strategia', en: 'Strategy' } },
    ];

    const GAMES = [
      { href: 'klondike/public/index.html', year: '2021', category: 'cards',
        title: "Grugnetto's Klondike",
        desc: { it: 'Solitario classico. Ogni partita è garantita vincibile.', en: 'Classic solitaire. Every deal is guaranteed winnable.' } },
      { href: 'briscola/index.html', year: '2005–2026', category: 'cards',
        title: "Grugnetto's Briscola",
        desc: { it: 'Gioca contro IA sviluppate in due decenni.', en: 'Play against AI opponents spanning two decades.' } },
      { href: 'glparchis/public/index.html', year: '2018', category: 'cards',
        title: 'glParchis',
        desc: { it: 'Porta a casa quattro pedine contro rivali umani o CPU.', en: 'Race four pawns home against local human or CPU rivals.' } },
      { href: 'game-of-the-goose/public/index.html', year: '2021', category: 'cards',
        title: 'Game of the Goose',
        desc: { it: 'Il classico gioco dell’oca, tra ponti, pozzi e oche.', en: 'The classic dice race, with bridges, wells and geese.' } },
      { href: 'grugnettos-goose/public/index.html', year: '2026', category: 'cards',
        title: "Grugnetto's Goose",
        desc: { it: 'Lo stesso classico, su due tabelloni storici autentici.', en: 'The same classic, on two genuine historical boards.' } },

      { href: 'netris/public/index.html', year: '1994', category: 'puzzle',
        title: 'Netris',
        desc: { it: 'Uno dei primi giochi a blocchi in stile Tetris.', en: 'An early Tetris-style falling-block game.' } },
      { href: 'hextris/public/index.html', year: '2014', category: 'puzzle',
        title: 'Hextris',
        desc: { it: 'Puzzle esagonale frenetico a blocchi.', en: 'Fast-paced hexagonal block puzzle.' } },
      { href: '54321/public/index.html', year: '2001', category: 'puzzle',
        title: '54321',
        desc: { it: 'Cinque puzzle, un solo motore, fino a quattro dimensioni.', en: 'Five puzzles, one engine, up to four dimensions.' } },
      { href: 'donkey-bolonkey/public/index.html', year: '2001', category: 'puzzle',
        title: 'Donkey Bolonkey',
        desc: { it: 'Abbina gli asinelli prima che li raggiunga il tritatutto.', en: 'Match donkeys before the crusher gets them.' } },
      { href: 'bubble-train/public/index.html', year: '2004', category: 'puzzle',
        title: 'Bubble Train',
        desc: { it: 'Spara bolle nel treno in corsa prima che arrivi al capolinea.', en: 'Shoot bubbles into a moving train before it reaches the end.' } },
      { href: 'disk-field/public/index.html', year: '2007', category: 'puzzle',
        title: 'Disk Field',
        desc: { it: 'Ruota il campo di forze per guidare il disco fino al bersaglio: 17 livelli di fisica.', en: 'Rotate the force field to steer the disk into the target: 17 physics levels.' } },

      { href: 'psypong3d/public/index.html', year: '2009', category: 'arcade',
        title: 'PSY PONG 3D',
        desc: { it: 'Ping pong psichedelico in 3D, per uno o due giocatori.', en: 'Psychedelic 3D table tennis, one or two players.' } },
      { href: 'nova-pinball/public/index.html', year: '2015', category: 'arcade',
        title: 'Nova Pinball',
        desc: { it: 'Flipper storico: manda la stella in nova attraverso la catena di missioni.', en: 'Historical pinball: make the star go nova through the full mission chain.' } },
      { href: 'mechanical-night-pinball/public/index.html', year: '2018', category: 'arcade',
        title: 'Mechanical Night Pinball',
        desc: { it: 'Flipper ricostruito con archeologia del software e fisica calibrata su Box2D.', en: 'A pinball table rebuilt through software archaeology, physics calibrated against Box2D.' } },
      { href: 'wok/public/index.html', year: '2001', category: 'arcade',
        title: 'Wok',
        desc: { it: 'Cattura le palline che cadono e rilanciale per fare combo.', en: 'Catch falling balls, throw them back for combos.' } },
      { href: 'don-ceferino/public/index.html', year: '2004', category: 'arcade',
        title: 'Don Ceferino Hazaña',
        desc: { it: 'Fai scoppiare palline rimbalzanti in 30 livelli a tema gaucho.', en: 'Pop bouncing balls across 30 gaucho-themed levels.' } },
      { href: 'yanoid/public/index.html', year: '2001', category: 'arcade',
        title: 'Yanoid',
        desc: { it: 'Yet Another arkaNOID — undici livelli da contest.', en: 'Yet Another arkaNOID — eleven contest stages.' } },
      { href: 'njam/index.html', year: '2003', category: 'arcade',
        title: 'Njam',
        desc: { it: 'Un gioco di inseguimento nel labirinto, con potenziamenti e duelli.', en: 'A maze chase game with power-ups and duels.' } },
      { href: 'html5-breakout/public/index.html', year: '2017', category: 'arcade',
        title: 'Breakout',
        desc: { it: 'Distruggi tutti i mattoncini, da solo o in due.', en: 'Smash every brick, one or two players.' } },
      { href: 'html5-space-invaders/public/index.html', year: '2017', category: 'arcade',
        title: 'Space Invaders',
        desc: { it: "Difenditi dall'invasione aliena.", en: 'Defend against the alien invasion.' } },
      { href: 'html5-snake/public/index.html', year: '2013', category: 'arcade',
        title: 'Snake',
        desc: { it: 'La versione spietata — una mossa sbagliata e hai finito.', en: 'The unforgiving version — one wrong move ends it.' } },
      { href: 'react-simple-snake/public/index.html', year: '2021', category: 'arcade',
        title: 'Snake (No Walls)',
        desc: { it: 'Uno Snake più clemente, che riappare dal lato opposto.', en: 'A gentler Snake that wraps around the edges.' } },

      { href: 'netrok/index.html', year: '2004', category: 'platform',
        title: 'Netrok',
        desc: { it: 'Corri, salta ed esplora 20 livelli originali.', en: 'Run, jump and explore 20 original levels.' } },
      { href: 'grugnetto-go/public/index.html', year: '2026', category: 'platform',
        title: 'Grugnetto Go!',
        desc: { it: 'Un platform tutto nuovo con Grugnetto protagonista.', en: 'A brand-new platformer starring Grugnetto.' } },

      { href: 'naval-battle/index.html', year: '2009', category: 'strategy',
        title: "Grugnetto's Naval Battle",
        desc: { it: 'Affonda la flotta nemica prima che affondi la tua.', en: 'Sink the enemy fleet before it sinks yours.' } },
      { href: 'for-science/public/index.html', year: '2013', category: 'strategy',
        title: 'For Science!',
        desc: { it: 'Abbina le tessere, carica gli attacchi, distruggi il laboratorio rivale.', en: 'Match tiles, arm attacks, destroy the rival lab.' } },
      { href: 'terramancers/public/index.html', year: '2012', category: 'strategy',
        title: 'Terramancers',
        desc: { it: 'Conquista il territorio in tempo reale, in stile Reversi.', en: 'Claim territory in real time, Reversi-style.' } },
    ];

    function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function storageSet(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } }

    const LANG_KEY = 'libre-arcade-lang';
    let lang = storageGet(LANG_KEY);
    if (!lang) lang = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
    if (!TEXT[lang]) lang = 'en';
    let activeFilter = 'all';
    let searchQuery = '';

    const filtersEl = document.getElementById('filters');
    const categoriesEl = document.getElementById('categories');
    const countEl = document.getElementById('count');
    const searchInputEl = document.getElementById('searchInput');
    const noResultsEl = document.getElementById('noResults');

    function buildFilters() {
      filtersEl.innerHTML = '';
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'filter-pill';
      all.dataset.filter = 'all';
      filtersEl.append(all);
      for (const cat of CATEGORIES) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-pill';
        btn.dataset.filter = cat.id;
        filtersEl.append(btn);
      }
      filtersEl.addEventListener('click', (event) => {
        const btn = event.target.closest('.filter-pill');
        if (!btn) return;
        activeFilter = btn.dataset.filter;
        render();
      });
    }

    function buildCategories() {
      categoriesEl.innerHTML = '';
      for (const cat of CATEGORIES) {
        const section = document.createElement('section');
        section.className = 'category';
        section.dataset.category = cat.id;
        section.style.setProperty('--dot', `var(--cat-${cat.id})`);
        section.innerHTML = `<h2><span class="dot"></span><span data-role="label"></span></h2><div class="grid" data-role="grid"></div>`;
        for (const game of GAMES.filter((g) => g.category === cat.id)) {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = game.href;
          a.dataset.category = cat.id;
          a.innerHTML = `<div class="top-row"><span class="year">${game.year}</span></div><h3 data-role="title"></h3><p data-role="desc"></p>`;
          a._game = game;
          section.querySelector('[data-role="grid"]').append(a);
        }
        categoriesEl.append(section);
      }
    }

    function matchesSearch(game) {
      if (!searchQuery) return true;
      const haystack = `${game.title} ${game.desc.it} ${game.desc.en}`.toLowerCase();
      return haystack.includes(searchQuery);
    }

    function render() {
      document.documentElement.lang = lang;
      for (const btn of filtersEl.querySelectorAll('.filter-pill')) {
        const id = btn.dataset.filter;
        const isAll = id === 'all';
        const label = isAll ? TEXT[lang].all : CATEGORIES.find((c) => c.id === id).label[lang];
        const count = isAll ? GAMES.length : GAMES.filter((g) => g.category === id).length;
        btn.textContent = `${label} (${count})`;
        btn.setAttribute('aria-pressed', String(id === activeFilter));
      }
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = TEXT[lang][el.dataset.i18n];
      });
      for (const btn of document.querySelectorAll('[data-lang-btn]')) {
        btn.setAttribute('aria-pressed', String(btn.dataset.langBtn === lang));
      }
      searchInputEl.placeholder = TEXT[lang].searchPlaceholder;
      searchInputEl.setAttribute('aria-label', TEXT[lang].searchAria);

      let visible = 0;
      for (const section of categoriesEl.querySelectorAll('section.category')) {
        const catId = section.dataset.category;
        section.querySelector('[data-role="label"]').textContent = CATEGORIES.find((c) => c.id === catId).label[lang];
        const categoryMatches = activeFilter === 'all' || activeFilter === catId;
        let visibleInSection = 0;
        for (const card of section.querySelectorAll('a.card')) {
          const show = categoryMatches && matchesSearch(card._game);
          card.hidden = !show;
          if (show) {
            card.querySelector('[data-role="title"]').textContent = card._game.title;
            card.querySelector('[data-role="desc"]').textContent = card._game.desc[lang];
            visibleInSection++;
          }
        }
        section.hidden = visibleInSection === 0;
        visible += visibleInSection;
      }
      countEl.textContent = lang === 'it'
        ? `${visible} gioc${visible === 1 ? 'o' : 'hi'}`
        : `${visible} game${visible === 1 ? '' : 's'}`;
      noResultsEl.hidden = visible !== 0;
    }

    document.querySelector('.lang-toggle').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-lang-btn]');
      if (!btn) return;
      lang = btn.dataset.langBtn;
      storageSet(LANG_KEY, lang);
      render();
    });

    searchInputEl.addEventListener('input', () => {
      searchQuery = searchInputEl.value.trim().toLowerCase();
      render();
    });

    buildFilters();
    buildCategories();
    render();
  </script>
  <script>
    // Silently reload this page when a newer deploy is live, so returning
    // visitors (and the author, right after pushing an update) never need
    // to manually clear the browser cache to see it. A `cache: "no-store"`
    // fetch bypasses the browser's own HTTP cache; the first check only
    // records a baseline, so a fresh load never triggers a spurious reload.
    (function watchForUpdates() {
      let baseline = null;
      async function check() {
        try {
          const response = await fetch(location.href, { cache: 'no-store' });
          if (!response.ok) return;
          const text = await response.text();
          if (baseline === null) { baseline = text; return; }
          if (text !== baseline) location.reload();
        } catch {
          // Offline or blocked; just try again on the next check.
        }
      }
      check();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      setInterval(check, 5 * 60 * 1000);
    })();
  </script>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
