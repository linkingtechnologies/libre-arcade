<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#cccc00">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Preservation port of Disk Field, PyWeek 5 (2007).">
  <title>Disk Field</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="menu">
  <main class="shell">
    <header class="topbar">
      <div class="identity"><strong>Disk Field</strong><span id="levelTitle"></span></div>
      <div class="toolbar">
        <button id="menuBtn" type="button">Menu</button>
        <select id="levelSelect" aria-label="Level"></select>
        <button id="restartBtn" type="button"></button>
        <button id="pauseBtn" type="button"></button>
        <button id="soundBtn" type="button"></button>
        <button id="musicBtn" type="button"></button>
        <button id="langBtn" type="button"></button>
      </div>
    </header>
    <section class="stage" aria-label="Disk Field">
      <canvas id="game" width="800" height="600" tabindex="0" aria-label="Disk Field game canvas" aria-describedby="help"></canvas>
      <div class="touchControls" aria-label="Rotation controls">
        <button id="leftBtn" class="turn" type="button" aria-label="Rotate counter-clockwise">↶</button>
        <button id="rightBtn" class="turn" type="button" aria-label="Rotate clockwise">↷</button>
      </div>
    </section>
    <footer><span id="help"></span><span id="status" role="status" aria-live="polite"></span></footer>
  </main>
  <script type="module" src="js/app.mjs"></script>
  <script data-goatcounter="https://grugnetto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
